[project]
name = "flowagent"
version = "0.1.0"
description = "An LLM drafts procedure flowcharts from PDFs; deterministic checks verify them before human sign-off."
requires-python = ">=3.10"
dependencies = []   # standard library only

[project.scripts]
flowagent = "flowagent.cli:main"

[tool.setuptools]
packages = ["flowagent", "flowagent.checks"]

[tool.setuptools.package-data]
flowagent = ["bases.json"]
